        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">🐾 Mascotas Center</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="perros.html">Perros</a></li>

    <main class="container my-5" style="max-width: 600px;">
        <h1 class="text-center mb-4">Calculadora de Ración Diaria</h1>
        <form class="card p-4 shadow-sm">
            <div class="mb-3">
                <label for="tipoMascota" class="form-label">Tipo de Mascota</label>
                <select id="tipoMascota" class="form-select">
                    <option value="perro">Perro</option>
                    <option value="gato">Gato</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="peso" class="form-label">Peso de la mascota (kg)</label>
                <input type="number" id="peso" class="form-control" placeholder="Ej: 12">
            </div>
            <button type="button" class="btn btn-primary w-100">Calcular Ración</button>
        </form>
    </main>

    <footer class="bg-dark text-white text-center py-4">
