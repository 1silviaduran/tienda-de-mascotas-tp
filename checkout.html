<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">🐾 Mascotas Center</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="perros.html">Perros</a></li>
                        <li class="nav-item"><a class="nav-link" href="gatos.html">Gatos</a></li>
                        <li class="nav-item"><a class="nav-link" href="calculadora.html">Calculadora</a></li>
                        <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>

                        <li class="nav-item"><a class="nav-link" href="login.html">Mi Cuenta</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 700px;">
        <h1 class="mb-4">Datos de Envío y Pago</h1>
        <form class="card p-4 shadow-sm">
            <h2 class="h5 mb-3">1. Dirección de Entrega (Salta Capital)</h2>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre y Apellido</label>
                <input type="text" id="nombre" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección / Barrio</label>
                <input type="text" id="direccion" class="form-control" required>
            </div>
            <h2 class="h5 mb-3 mt-4">2. Método de Pago</h2>
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="pago" id="efectivo" checked>
                <label class="form-check-label" for="efectivo">Efectivo contra entrega</label>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="pago" id="mp">
                <label class="form-check-label" for="mp">MercadoPago / Transferencia</label>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">Confirmar Pedido</button>
        </form>
    </main>

    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p class="mb-1">🐾 Mascotas Center — Salta Capital, Argentina</p>
            <small class="text-muted">© 2026 Todos los derechos reservados.</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
